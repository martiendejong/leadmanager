# Jengo Clients · één stack per omgeving (test / acc / prod), elk in een eigen map met een eigen .env.
# De stack publiceert geen poorten: de gedeelde Caddy-gateway op de server bereikt de container via het
# externe Docker-netwerk onder de alias ${ENV_PREFIX}-clients (zie deploy/README.md).
name: clients-${ENV_PREFIX}

services:
  api:
    build:
      context: ..
    image: jengo-clients:${ENV_PREFIX}
    restart: unless-stopped
    # LeadManager heeft eerder 42 GB geheugen opgeslokt door een oneindige lus (incident 27-08, gefixt
    # in PR #45). Een harde grens zorgt dat een volgende bug alleen deze container raakt, niet de
    # buren op een gedeelde server.
    mem_limit: ${MEM_LIMIT:-768m}
    pids_limit: 512
    # De app hoeft niets bijzonders: geen extra rechten en geen privilege-escalatie.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-LeadManager}
      Jwt__Audience: ${JWT_AUDIENCE:-LeadManagerClient}
      # Eerste beheerder. Zonder deze twee waarden wordt er geen account aangemaakt (geen standaardwachtwoord).
      Seed__Admins__0__Email: ${ADMIN_EMAIL}
      Seed__Admins__0__Password: ${ADMIN_PASSWORD}
      Seed__Admins__0__FirstName: ${ADMIN_FIRST_NAME:-Admin}
      # Alleen voor herstel (init-env --force zet dit aan, deploy.sh haalt het na de start weer weg).
      Seed__ResetExistingPasswords: ${SEED_RESET_PASSWORDS:-false}
      Cors__Origins__0: ${PUBLIC_URL}
      Sso__CallbackBaseUrl: ${PUBLIC_URL}
      # Uploaded documents (contracts, quotes) live in the data volume, so the backup script archives them.
      Documents__Path: /data/documents
      Sso__Issuer: ${SSO_ISSUER:-https://maendeleo.martiendejong.nl}
      Sso__ClientId: ${SSO_CLIENT_ID:-leadmanager}
      # Optioneel. Leeg = die functie staat uit. Op test bewust leeg laten.
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      # Lead hunt: the app starts a background Jengo agent by creating a JengoWork task (JengoWork__* below, board 105 "Jengo Clients" by default).
      # Each hunt gets a task token (stored hashed, one hour, one call) that goes into that task's text; the first /brief call exchanges it for a short
      # session token. A person has to start the task on JengoWork until board 105 is monitored by jengo-agi (then set HUNT_DISPATCH_AGENT_PICKS_UP=true).
      # No OpenAI key is needed. Empty JengoWork settings = Find new leads answers 503 "Agent hunting is not configured on this server".
      Hunt__Dispatch__BoardId: ${HUNT_DISPATCH_BOARD_ID:-}
      Hunt__Dispatch__Status: ${HUNT_DISPATCH_STATUS:-}
      Hunt__Dispatch__AgentPicksUp: ${HUNT_DISPATCH_AGENT_PICKS_UP:-false}
      Hunt__AllowedEmails: ${HUNT_ALLOWED_EMAILS:-}
      Hunt__MaxPerUserPerDay: ${HUNT_MAX_PER_USER_PER_DAY:-5}
      Hunt__MaxVerifyPerUserPerDay: ${HUNT_MAX_VERIFY_PER_USER_PER_DAY:-20}
      Hunt__ApiBaseUrl: ${HUNT_API_BASE_URL:-}
      JengoWork__BaseUrl: ${JENGOWORK_BASE_URL:-}
      JengoWork__ApiKey: ${JENGOWORK_API_KEY:-}
      # Jengo Track (klik-tracking). Uit tenzij TRACK_ENABLED=true.
      JengoTrack__Enabled: ${TRACK_ENABLED:-false}
      JengoTrack__BaseUrl: ${TRACK_BASE_URL:-}
      JengoTrack__ApiKey: ${TRACK_API_KEY:-}
      JengoTrack__WebhookSecret: ${TRACK_WEBHOOK_SECRET:-}
      JengoTrack__HotThreshold: ${TRACK_HOT_THRESHOLD:-2}
      MinoxPoc__BaseUrl: ${MINOX_POC_BASE_URL:-}
    volumes:
      - ./data:/data
    networks:
      gateway:
        aliases:
          - ${ENV_PREFIX}-clients

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK}
